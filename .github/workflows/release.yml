name: Release

# Build and publish one downloadable weui.koplugin.zip release asset whenever
# a version tag (v*) is pushed. Z-Library is vendored inside the WeUI plugin
# directory, so the archive contains exactly one top-level .koplugin folder.
# The OTA updater downloads this exact filename.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke syntax check (Lua 5.1)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          # Syntax-only parse; never executes. Best-effort: LuaJIT-specific
          # constructs may flag false positives, hence continue-on-error.
          fail=0
          while IFS= read -r f; do
            luac5.1 -p "$f" || { echo "::warning::$f failed syntax check"; fail=1; }
          done < <(find . -name '*.lua' -not -path './.git/*')
          exit 0

      - name: Package WeUI
        run: |
          set -e
          # The repo root IS the complete plugin, including the embedded
          # zlibrary/ module. Extracting into koreader/plugins/ therefore
          # creates exactly one weui.koplugin/ directory.
          mkdir -p stage/weui.koplugin
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='stage' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='.runtime-visual.koplugin' \
            --exclude='scripts' \
            --exclude='*.swp' \
            --exclude='*~' \
            --exclude='weui_update.zip' \
            --exclude='zlibrary_credentials.lua' \
            ./ stage/weui.koplugin/
          ( cd stage && zip -rq weui.koplugin.zip weui.koplugin )
          test -f stage/weui.koplugin/LICENSE.zlibrary
          test -f stage/weui.koplugin/zlibrary/embedded_plugin.lua
          echo "::group::zip contents"
          unzip -l stage/weui.koplugin.zip | head -40
          echo "::endgroup::"
          unzip -tq stage/weui.koplugin.zip
          ls -la stage/weui.koplugin.zip

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Publishing release for tag $TAG"
          # Idempotent: create the release if missing, otherwise just (re)upload the asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" stage/weui.koplugin.zip --clobber
          else
            gh release create "$TAG" stage/weui.koplugin.zip \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
