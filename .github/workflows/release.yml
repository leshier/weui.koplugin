name: Release

# Build and publish normal and opt-in initialization archives whenever
# a version tag (v*) is pushed. Both book sources are vendored inside WeUI,
# so the archive contains exactly one top-level .koplugin folder.
# The OTA updater downloads this exact filename.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit gettext

      - name: Run release test gate
        run: |
          LUA_BIN=luajit scripts/run_tests.sh
          LUA_BIN=luajit python3 scripts/qa/run_weread_specs.py

      - name: Package WeUI
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(sed -n 's/.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' _meta.lua)
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          bash scripts/package_release.sh stage
          echo "::group::zip contents"
          unzip -l stage/weui.koplugin.zip | sed -n '1,40p'
          echo "::endgroup::"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' _meta.lua)
          TAG="v$VERSION"
          echo "Publishing release for tag $TAG"
          # Idempotent: create the release if missing, otherwise just (re)upload the asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" stage/weui.koplugin.zip stage/weui.koplugin-initialize.zip --clobber
          else
            gh release create "$TAG" stage/weui.koplugin.zip stage/weui.koplugin-initialize.zip \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
